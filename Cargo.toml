[package]
name = "bam-smart-routing-client"
version = "0.1.0"
edition = "2024"
description = "Smart routing client for BAM Solana testnet regions"
authors = ["naruto11"]
license = "MIT"
repository = ""
readme = "README.md"
keywords = ["solana", "bam", "routing", "rpc"]
categories = ["api-bindings", "network-programming"]

[lib]
name = "bam_smart_routing_client"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
futures = "0.3"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# solana-client = "1.18.26"
solana-client = "3.0.6"
# solana-sdk = "1.18.26"
solana-sdk = "=3.0.0"
solana-rpc-client-api = "3.0.6"
solana-commitment-config = "3.0.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
httpmock = "0.6"
rand = "0.8"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
